{% extends 'base.html' %}

{% block content %}

<div class="container py-4">

    <h3 class="mb-4 fw-bold">🔒 Secure Checkout</h3>

    <form method="GET" action="/user/pay" >

        <div class="row g-4">

            <!-- LEFT SIDE -->
            <div class="col-lg-8">

                <!-- DELIVERY ADDRESS -->
                <div class="bg-white p-4 rounded shadow-sm mb-4">

                    <h5 class="mb-3 fw-bold">📍 Delivery Address</h5>

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Full Name *</label>
                            <input name="name" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Mobile Number *</label>
                            <input name="phone" class="form-control" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Full Address *</label>
                            <textarea name="address" class="form-control" rows="3" required></textarea>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">City *</label>
                            <input name="city" class="form-control" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">State *</label>
                            <input name="state" class="form-control" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Pincode *</label>
                            <input name="pincode" class="form-control" required>
                        </div>

                    </div>
                </div>

                <!-- PAYMENT -->
                <div class="bg-white p-4 rounded shadow-sm">

                    <h5 class="mb-3 fw-bold">💳 Payment</h5>

                    <p class="text-muted small">
                        Your payment is secure. Supports only Online Payment.
                    </p>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="payment" value="ONLINE">
                        <label class="form-check-label">Online Payment</label>
                    </div>

                    <button type="submit"
                            class="btn w-100 py-2 text-white"
                            style="background-color: cadetblue;">
                        🔒 Place Order
                    </button>

                </div>

            </div>

            <!-- RIGHT SIDE -->
            <div class="col-lg-4">

                <div class="bg-white p-4 rounded shadow-sm position-sticky" style="top: 20px;">

                    <h5 class="mb-3 fw-bold">Order Summary</h5>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span>₹{{ grand_total }}</span>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping</span>
                        <span class="text-success">FREE</span>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>Total Payable</span>
                        <span style="color: cadetblue;">₹{{ grand_total }}</span>
                    </div>

                    <hr>

                    <div class="text-muted small">
                        <p class="mb-1">🔒 Secure Checkout</p>
                        <p class="mb-0">🧾 Invoice after payment</p>
                    </div>

                </div>

            </div>

        </div>

    </form>

</div>

{% endblock %}
