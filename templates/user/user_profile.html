{% extends 'base.html' %}

{% block content %}

<h3 class="mb-4 text-center">My Profile</h3>

<div class="card p-4 shadow-sm" style="max-width:600px; margin:auto; border-radius:15px;">

    <!-- PROFILE IMAGE (CENTERED) -->
    <div class="text-center mb-4">
        {% if user.profile_image %}
            <img src="/static/uploads/user_profiles/{{ user.profile_image }}"
                 style="width:120px; height:120px; object-fit:cover; border-radius:50%; border:3px solid #eee;">
        {% else %}
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                 style="width:120px; border-radius:50%;">
        {% endif %}
    </div>

    <form method="POST" enctype="multipart/form-data">

        <!-- NAME -->
        <label class="fw-semibold">Name</label>
        <input type="text" name="name" class="form-control mb-3"
               value="{{ user.name }}" required>

        <!-- EMAIL -->
        <label class="fw-semibold">Email</label>
        <input type="email" name="email" class="form-control mb-3"
               value="{{ user.email }}" required>

        <!-- PASSWORD -->
        <label class="fw-semibold">New Password (optional)</label>
        <input type="password" name="password" class="form-control mb-3"
               placeholder="Leave blank to keep old password">

        <!-- IMAGE UPLOAD -->
        <label class="fw-semibold">Change Profile Image</label>
        <input type="file" name="profile_image" class="form-control mb-4">

        <!-- BUTTON -->
        <button class="btn btn-dark w-100">Update Profile</button>
        <div class="mt-3 text-center">
            <a href="/user-dashboard" class="btn btn-outline-dark">
        ← Back to Dashboard
    </a>
</div>

    </form>

</div>

{% endblock %}
