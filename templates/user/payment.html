{% extends 'base.html' %}

{% block content %}

<div class="container py-4 py-md-5">

    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">

            <div class="card shadow-sm border-0 rounded-4 p-3 p-md-4 text-center">

                <h4 class="fw-bold mb-2">💳 Secure Payment</h4>

                <p class="text-muted small mb-3 mb-md-4">
                    Complete your purchase safely using Razorpay
                </p>

                <!-- AMOUNT -->
                <div class="mb-3 mb-md-4">
                    <h2 class="fw-bold" style="color: cadetblue; font-size: 2rem;">
                        ₹{{ amount }}
                    </h2>
                    <p class="text-muted small mb-0">Total Amount Payable</p>
                </div>

                <!-- BUTTON -->
                <button id="pay-btn"
                        class="btn w-100 py-2 py-md-3 text-white fw-semibold"
                        style="background-color: cadetblue; font-size: 1rem;">
                    Pay Now
                </button>

                <p class="text-muted small mt-3 mb-0">
                    🔒 Secure encrypted payment
                </p>

            </div>

        </div>
    </div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
document.getElementById("pay-btn").onclick = function(e) {

    var options = {
        "key": "{{ key_id }}",
        "amount": "{{ amount_paise }}",
        "currency": "INR",
        "name": "SmartCart",
        "description": "Order Payment",
        "order_id": "{{ order_id }}",

        "handler": function (response){

            fetch("/verify-payment", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_signature: response.razorpay_signature
                })
            })
            .then(res => res.text())
            .then(data => {
                if (data !== "failed") {
                    window.location.href = "/user/order-success/" + data;
                } else {
                    alert("Payment verification failed ❌");
                }
            });
        },

        "theme": {
            "color": "#5f9ea0"
        }
    };

    var rzp = new Razorpay(options);
    rzp.open();

    e.preventDefault();
}
</script>

{% endblock %}
