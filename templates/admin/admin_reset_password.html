{% extends 'auth_base.html' %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card shadow p-4" style="width:100%; max-width:400px; border-radius:15px;">

        <h4 class="text-center mb-3">🔐 Admin Reset Password</h4>

        <p class="text-center text-muted" style="font-size:14px;">
            Enter your new admin password
        </p>

        <!-- FLASH MESSAGES -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-danger py-2 text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="mb-3">
                <input type="password" name="password"
                       class="form-control"
                       placeholder="New Password"
                       required>
            </div>

            <div class="mb-3">
                <input type="password" name="confirm_password"
                       class="form-control"
                       placeholder="Confirm Password"
                       required>
            </div>

            <button class="btn w-100"
                    style="background:#f8a5c2; color:white;">
                Reset Password
            </button>

        </form>

        <div class="text-center mt-3">
            <a href="/admin-login" class="text-decoration-none">
                Back to Login
            </a>
        </div>

    </div>

</div>

{% endblock %}
