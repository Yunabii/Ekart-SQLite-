{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h3 class="text-center mb-4">Add Product</h3>

    <!-- FLASH MESSAGES -->
    {% for msg in get_flashed_messages() %}
        <div class="alert alert-success text-center">
            {{ msg }}
        </div>
    {% endfor %}

    <div class="card p-4 shadow-sm mx-auto add-product-card">

        <form method="POST" action="/admin/add-item" enctype="multipart/form-data">

            <div class="row">

                <!-- LEFT SIDE -->
                <div class="col-md-6">

                    <label class="form-label">Product Name</label>
                    <input type="text" name="name" class="form-control mb-3" required>

                    <label class="form-label">Category</label>
                    <input type="text" name="category" class="form-control mb-3" required>

                    <label class="form-label">Price</label>
                    <input type="number" step="0.01" name="price" class="form-control mb-3" required>

                </div>

                <!-- RIGHT SIDE -->
                <div class="col-md-6">

                    <label class="form-label">Description</label>
                    <textarea name="description" rows="5"
                              class="form-control mb-3" required></textarea>

                    <label class="form-label">Product Image</label>
                    <input type="file" name="image" class="form-control mb-3" required>

                    <!-- IMAGE PREVIEW -->
                    <img id="preview" class="img-fluid rounded d-none mt-2" style="max-height:150px;">

                </div>

            </div>

            <!-- BUTTON -->
            <button class="btn btn-dark w-100 mt-3">
                Add Product
            </button>

        </form>

    </div>

    <!-- BACK BUTTON -->
    <div class="text-center mt-3 mb-5 pb-4">
        <a href="/admin-dashboard" class="btn btn-outline-dark">
            Back to Dashboard
        </a>
    </div>

</div>

<!-- IMAGE PREVIEW SCRIPT -->
<script>
document.querySelector("input[name='image']").addEventListener("change", function(event) {
    let preview = document.getElementById("preview");
    let file = event.target.files[0];

    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.classList.remove("d-none");
    }
});
</script>

{% endblock %}
