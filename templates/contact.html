{% extends 'auth_base.html' %}

{% block content %}

<div class="container bg-white p-4 rounded shadow" style="max-width:500px;">

    <!-- BACK BUTTON -->
    <a href="/" class="btn btn-sm btn-dark mb-3">← Back</a>

    <h3 class="text-center mb-3">Contact Us 📩</h3>

    <form method="POST">

        <input type="text" name="name" class="form-control mb-2" placeholder="Your Name" required>

        <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>

        <input type="text" name="phone" class="form-control mb-2" placeholder="Contact Number" required>

        <textarea name="message" class="form-control mb-3" placeholder="Your Message" required></textarea>

        <button class="btn btn-dark w-100 mb-3">Submit</button>

    </form>

    <!-- MAIL LINK -->
    <div class="text-center">
        <a href="mailto:nishnathidas@gmail.com" class="fw-semibold text-decoration-none" style="color:#d96b8c;">
            Mail us?
        </a>
    </div>

</div>

{% endblock %}
